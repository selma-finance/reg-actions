name: release

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu --bin reg-actions

      - name: Package
        run: |
          set -euo pipefail
          out="reg-actions-x86_64-unknown-linux-gnu.tar.gz"
          tar czf "$out" -C "target/x86_64-unknown-linux-gnu/release" reg-actions
          shasum -a 256 "$out" > checksums.txt
          cat checksums.txt

      - name: Recreate rc-rust release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release delete rc-rust --cleanup-tag --yes --repo "$REPO" || true
          gh release create rc-rust \
            --repo "$REPO" \
            --target "$SHA" \
            --title "rc-rust (preview)" \
            --notes "Linux x86_64 preview build of the Rust + wasmtime port. Force-updated on every push to develop." \
            --prerelease \
            reg-actions-x86_64-unknown-linux-gnu.tar.gz checksums.txt
