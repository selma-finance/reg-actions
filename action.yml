name: "reg-actions"
author: "bokuweb"
description: 'A visual regression test tool for github actions (Rust + wasmtime).'
branding:
  icon: 'aperture'
  color: 'red'
inputs:
  github-token:
    description: 'GitHub API access token. Used to upload test report and add comments to pull requests.'
    required: true
  image-directory-path:
    description: "Path to images directory. Images stored here are compared with the expected images from the last upload."
    required: true
  enable-antialias:
    description: "Enable antialias. Default false."
    required: false
  matching-threshold:
    description: "Matching threshold (0-1). Smaller values make comparison more sensitive. Default 0."
    required: false
  threshold-rate:
    description: "Rate threshold for change detection. Applied after matching-threshold. Default 0."
    required: false
  threshold-pixel:
    description: "Pixel threshold. Takes precedence over threshold-rate. Default 0."
    required: false
  target-hash:
    description: "The commit hash to compare against."
    required: false
  artifact-name:
    description: "Workflow artifact name. Default `reg`."
    required: false
  branch:
    description: "Branch name that manages images. Default `reg_actions`."
    required: false
  disable-branch:
    description: "Disable push to branch. Images won't appear in comments."
    required: false
  custom-report-page:
    description: "Custom report page URL."
    required: false
  report-file-path:
    description: "Path of generated report html. Not included in artifact."
    required: false
  comment-report-format:
    description: "How to render changed file in comment. `raw` (default) or `summarized`."
    required: false
  outdated-comment-action:
    description: "Outdated comment handling: `none` (default), `minimize`, or `update`."
    required: false
  comment-mode:
    description: "When to post PR comments: `always` (default), `changes`, or `never`."
    required: false
  retention-days:
    description: "Image retention duration in days. Default 30."
    required: false
runs:
  using: "node24"
  main: "dist/index.cjs"
